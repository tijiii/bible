# Déploie le serveur de la bible (dossier worker/ : ajout rapide et base partagée)
# à chaque modification de ce dossier sur main, ou à la main depuis l'onglet Actions.
# Secrets du dépôt nécessaires : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY (et BIBLE_KEY pour le check-in).
name: Déployer l'ajout rapide

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BIBLE_KEY: ${{ secrets.BIBLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Clé utilisée par le script du check-in pour écrire dans la base.
      # Facultative : sans le secret BIBLE_KEY, cette étape est sautée.
      - name: Clé du check-in
        if: env.BIBLE_KEY != ''
        working-directory: worker
        run: printf '%s' "$BIBLE_KEY" | npx wrangler secret put BIBLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
