<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bible">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Casting Bible</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=2026-10-21-9">
</head>
<body>

<div id="app">
  <header class="hdr">
    <div class="hdr-home" onclick="goHome()" title="Accueil">
      <img class="hdr-logo" src="widen-logo.png" alt="WIDEN">
      <div class="hdr-brand">CASTING BIBLE</div>
      <div class="hdr-sub">OUTDOOR · PRODUCTION</div>
    </div>
    <div class="hdr-right">
      <span class="count-pill hide-mobile" id="total-count"></span>
      <span class="count-pill" id="sync-status">↻ SYNCHRONISATION...</span>
      <button class="btn-quick" id="btn-install" style="display:none" onclick="installApp()">INSTALLER L'APP</button>
      <button class="btn-quick" id="btn-quick" style="display:none" onclick="openQuickAdd()">AJOUT RAPIDE</button>
      <button class="btn-add" onclick="openAddChooser()">+ AJOUTER</button>
    </div>
  </header>
  <nav class="espaces" id="espaces-nav"></nav>
  <nav class="crumbs" id="tabs-nav"></nav>
  <main id="main-content"></main>
</div>

<!-- FORM MODAL (add/edit talent or club) -->
<div class="modal-bg" id="form-modal" style="display:none">
  <div class="modal" id="form-modal-inner">
    <div class="modal-hdr">
      <span class="modal-title" id="form-title"></span>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <div class="modal-body" id="form-body"></div>
    <div class="modal-footer" id="form-footer">
      <button class="btn-del" id="form-btn-del" style="display:none" onclick="deleteFromForm()">✕ SUPPRIMER</button>
      <div class="spacer"></div>
      <button class="btn-cancel" onclick="closeForm()">ANNULER</button>
      <button class="btn-save" id="btn-save" onclick="submitForm()">SAUVEGARDER</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="detail-modal" style="display:none" onclick="if(event.target===this)closeDetail()">
  <div class="modal wide">
    <div class="modal-hdr">
      <span class="modal-title" id="detail-title" style="color:var(--text)"></span>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn-del" onclick="delFromDetail()">✕ SUPPRIMER</button>
      <div class="spacer"></div>
      <button class="btn-cancel" onclick="closeDetail()">FERMER</button>
      <button class="btn-save" onclick="editFromDetail()">ÉDITER</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="geo.js?v=2026-10-21-9"></script>
<script src="data.js?v=2026-10-21-9"></script>
<script src="config.js?v=2026-10-21-9"></script>
<script src="sync.js?v=2026-10-21-9"></script>
<script src="app.js?v=2026-10-21-9"></script>
<script src="docvue.js?v=2026-10-21-9"></script>
<script src="export.js?v=2026-10-21-9"></script>
<script src="prod.js?v=2026-10-21-9"></script>
<script src="taches.js?v=2026-10-21-9"></script>
<script src="projets.js?v=2026-10-21-9"></script>
</body>
</html>
